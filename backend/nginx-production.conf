# ===========================================
# 教学平台 Nginx 配置文件（生产环境）
# 域名: class.codebn.cn
# 用途: 前端静态文件服务 + 后端API反向代理
# ===========================================

# HTTP服务器（自动跳转到HTTPS）
server {
    listen 80;
    server_name class.codebn.cn;
    
    # 强制跳转到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name class.codebn.cn;
    
    # SSL证书配置（宝塔面板自动生成路径）
    ssl_certificate /www/server/panel/vhost/cert/class.codebn.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/class.codebn.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 前端静态文件根目录
    root /www/wwwroot/teaching-platform/web;
    index index.html;
    
    # 日志配置
    access_log /www/wwwlogs/class-codebn-access.log;
    error_log /www/wwwlogs/class-codebn-error.log;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # 客户端上传大小限制（用于文件上传）
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # ===========================================
    # 前端路由（Vue Router history模式）
    # ===========================================
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # ===========================================
    # 后端API代理配置
    # ===========================================
    
    # 统一API代理（除/classroom与/socket.io需单独长连接）
    location ~ ^/(sys|api|teaching|student|class|course|homework|teacher|relation|learning|resource|programming|health) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # WebSocket支持（通用）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
    }
    
    # 实时课堂接口
    location ^~ /classroom/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        
        # WebSocket长连接支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket需要更长的超时时间
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_buffering off;
    }
    
    
    # ===========================================
    # Socket.IO WebSocket代理（⚠️ 重要）
    # ===========================================
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        
        # WebSocket必需配置
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket长连接超时（24小时）
        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        
        # 禁用缓冲
        proxy_buffering off;
        
        # 允许大数据包
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    # ===========================================
    # 上传文件（已全部走OSS，禁用本地uploads）
    # ===========================================
    
    location /uploads/ {
        return 404;
    }
    
    # ===========================================
    # 安全配置
    # ===========================================
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* \.(env|sql|log|bak|backup|swp|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问node_modules
    location /node_modules/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ===========================================
    # 静态资源缓存
    # ===========================================
    
    # CSS、JS文件缓存
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 图片文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 字体文件缓存
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
    
    # 媒体文件缓存
    location ~* \.(mp4|mp3|webm|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ===========================================
# 配置说明
# ===========================================
# 
# 1. WebSocket支持：
#    - 所有API路径都配置了 Upgrade 和 Connection 头
#    - /socket.io/ 路径专门用于Socket.IO连接
#    - 超时时间根据不同场景调整
# 
# 2. 代理头设置：
#    - X-Real-IP: 传递真实客户端IP
#    - X-Forwarded-For: IP转发链
#    - X-Forwarded-Proto: 协议类型(https)
#    - 后端使用 trust proxy 可正确获取客户端信息
# 
# 3. 安全配置：
#    - 强制HTTPS
#    - 禁止访问敏感文件
#    - 上传目录禁止执行脚本
#    - CSP、HSTS等安全头
# 
# 4. 性能优化：
#    - Gzip压缩
#    - 静态资源缓存
#    - HTTP/2支持
#    - 合理的缓冲配置
# 
# 5. 使用方法：
#    - 复制此文件到宝塔面板的站点配置
#    - 修改域名为您的域名
#    - 修改SSL证书路径（宝塔自动生成）
#    - 检查配置: nginx -t
#    - 重启Nginx: nginx -s reload
# 
# ===========================================
