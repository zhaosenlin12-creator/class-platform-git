# AIDE minimal config for integrity monitoring
database=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
gzip_dbout=yes
report_url=file:/var/log/aide/aide.log

# Common definitions
NORMAL = p+i+n+u+g+s+m+c+md5+sha256
DIR = p+i+n+u+g+type

# Critical system files
/bin        NORMAL
/sbin       NORMAL
/usr/bin    NORMAL
/usr/sbin   NORMAL
/etc        NORMAL
/var/log    DIR

# Application
/srv/teaching-platform NORMAL

# Exclusions
!/var/log/aide/.*
!/var/log/journal/.*
