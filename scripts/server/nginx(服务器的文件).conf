# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name class.codebn.cn;
    return 301 https://$server_name$request_uri;
}

# HTTPS服务器 - 主配置
server {
    listen 443 ssl;
    http2 on;
    server_name class.codebn.cn;

    # SSL证书
    ssl_certificate /www/server/panel/vhost/cert/class.codebn.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/class.codebn.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 前端静态文件
    root /www/wwwroot/teaching-platform/web/dist;
    include /www/server/panel/vhost/nginx/extension/class.codebn.cn/*.conf;
    index index.html index.htm;

    # 日志
    access_log /www/wwwlogs/class-codebn-access.log;
    error_log /www/wwwlogs/class-codebn-error.log;

    # 文件上传大小
    client_max_body_size 100M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/
xml+rss text/javascript;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件
    location /uploads/ {
        alias /www/wwwroot/teaching-platform/backend/uploads/;
        autoindex off;
    }

    # ========================================
    # 前端路由
    # ========================================
    location ^~ /student/home { try_files $uri $uri/ /index.html; }
    location ^~ /student/works { try_files $uri $uri/ /index.html; }
    location ^~ /student/homework { try_files $uri $uri/ /index.html; }
    location ^~ /student/my-courses { try_files $uri $uri/ /index.html; }
    location ^~ /student/my-homework { try_files $uri $uri/ /index.html; }
    location ^~ /student/my-classrooms { try_files $uri $uri/ /index.html; }
    location ^~ /student/profile { try_files $uri $uri/ /index.html; }
    location ^~ /student/programming { try_files $uri $uri/ /index.html; }
    location ^~ /student/classroom { try_files $uri $uri/ /index.html; }

    location ^~ /classroom/online { try_files $uri $uri/ /index.html; }
    location ^~ /classroom/review { try_files $uri $uri/ /index.html; }

    location ^~ /admin { try_files $uri $uri/ /index.html; }
    location ^~ /dashboard { try_files $uri $uri/ /index.html; }
    location ^~ /management { try_files $uri $uri/ /index.html; }

    location ^~ /teaching/mineCourse { try_files $uri $uri/ /index.html; }
    location ^~ /teaching/course-management { try_files $uri $uri/ /index.html; }
    location ^~ /teaching/classroom-management { try_files $uri $uri/ /index.html; }
    location ^~ /teaching/homework-management { try_files $uri $uri/ /index.html; }
    location ^~ /teaching/student-management { try_files $uri $uri/ /index.html; }

    location = /course { try_files $uri $uri/ /index.html; }
    location = /course/ { try_files $uri $uri/ /index.html; }

    location = /programming { try_files $uri $uri/ /index.html; }
    location = /programming/ { try_files $uri $uri/ /index.html; }
    location ^~ /programming/workspace { try_files $uri $uri/ /index.html; }
    location ^~ /programming/editor { try_files $uri $uri/ /index.html; }

    location = /teacher/dashboard { try_files $uri $uri/ /index.html; }
    location = /teacher/course-management { try_files $uri $uri/ /index.html; }
    location = /teacher/course-content { try_files $uri $uri/ /index.html; }
    location = /teacher/resource-library { try_files $uri $uri/ /index.html; }
    location = /teacher/student-management { try_files $uri $uri/ /index.html; }
    location = /teacher/student-analytics { try_files $uri $uri/ /index.html; }
    location = /teacher/homework-review { try_files $uri $uri/ /index.html; }
    location = /teacher/classroom { try_files $uri $uri/ /index.html; }
    location = /teacher/students { try_files $uri $uri/ /index.html; }

    location ^~ /portal { try_files $uri $uri/ /index.html; }
    location ^~ /user { try_files $uri $uri/ /index.html; }

    # ========================================
    # API代理 - 后端接口（Docker映射到本机127.0.0.1:8081）
    # ========================================
    location ^~ /sys/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /teaching/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/student($|/(?!home|works|homework|my-|profile|programming|classroom).*)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/classroom($|/(?!online|review).*)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/class($|/.*)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /course/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /homework/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /teacher/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /relation/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /learning/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /resource/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/programming/(workspace|editor)$ {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /programming/run {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /programming/save {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /programming/load {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /programming/files {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /programming/execute {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /programming/test {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /common/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io WebSocket
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400;
    }

    # 兜底规则
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}