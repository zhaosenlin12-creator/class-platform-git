<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <!-- Logo 渐变色：科技蓝到青色 -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#00BCD4" />
    </linearGradient>
    <!-- 文字发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 左侧几何编程图标 -->
  <g transform="translate(10, 10)">
    <!-- 六边形背景 -->
    <path d="M 20 2 L 38 12 L 38 32 L 20 42 L 2 32 L 2 12 Z" 
          fill="none" 
          stroke="url(#logoGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- 中间代码符号结构 -->
    <!-- 左箭头 < -->
    <path d="M 16 16 L 8 22 L 16 28" 
          fill="none" 
          stroke="#00BCD4" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- 右箭头 > -->
    <path d="M 24 16 L 32 22 L 24 28" 
          fill="none" 
          stroke="#2196F3" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- 中间斜杠 / -->
    <line x1="22" y1="12" x2="18" y2="32" 
          stroke="url(#logoGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
  </g>

  <!-- 右侧文字部分 -->
  <g transform="translate(65, 30)">
    <!-- 主标题：“乐启享” -->
    <text x="0" y="5" 
          font-family="'Microsoft YaHei', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="24" 
          fill="#333" 
          letter-spacing="1">
      乐<tspan fill="url(#logoGrad)">启</tspan>享
    </text>
    
    <!-- 英文副标题 -->
    <text x="80" y="5" 
          font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" 
          font-weight="900" 
          font-size="16" 
          fill="#2196F3" 
          letter-spacing="2"
          font-style="italic">
      CODE
    </text>
    
    <!-- 底部描述文本 -->
    <text x="2" y="20" 
          font-family="'Microsoft YaHei', -apple-system, sans-serif" 
          font-weight="500" 
          font-size="11" 
          fill="#8c8c8c" 
          letter-spacing="2">
      少 儿 编 程 教 育
    </text>
  </g>
</svg>
